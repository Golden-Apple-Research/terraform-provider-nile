name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: SPDX license headers
        run: make license-check

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        run: |
          # Pin the scanner to the v1.8.0 commit rather than a mutable tag.
          go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: high-confidence secret scan
        run: |
          if git grep -n -I -E -- '-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----|\bAKIA[0-9A-Z]{16}\b|\bgh[pousr]_[A-Za-z0-9_]{20,}\b|\bgithub_pat_[A-Za-z0-9_]{20,}\b|\bxox[baprs]-[0-9A-Za-z-]{20,}\b'; then
            echo "high-confidence secret pattern found" >&2
            exit 1
          fi

      - name: verify generated docs
        run: |
          go run ./tools/gendocs
          git diff --exit-code docs/

      - name: go test
        run: go test ./... -v -race

  smoke:
    name: Smoke test (mock API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Run smoke test
        run: tests/smoke/run.sh
