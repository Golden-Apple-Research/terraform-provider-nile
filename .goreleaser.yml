#
# Release configuration for the public Terraform Registry.
#
# The registry requires, for a vX.Y.Z tag:
#   - terraform-provider-nile_<version>_<os>_<arch>.zip archives
#   - terraform-provider-nile_<version>_SHA256SUMS
#   - terraform-provider-nile_<version>_SHA256SUMS.sig (detached GPG signature)
#
# GPG signing uses the GPG_FINGERPRINT env var set by the release workflow.

version: 2

project_name: terraform-provider-nile

builds:
  - id: terraform-provider-nile
    binary: '{{ .ProjectName }}_v{{ .Version }}'
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - freebsd
      - linux
      - windows
    goarch:
      - '386'
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: freebsd
        goarch: '386'
      - goos: freebsd
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

archives:
  - id: zipped
    formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'

signs:
  - id: checksums
    artifacts: checksum
    cmd: gpg
    output: true
    signature: '${signature}'
    args:
      - --batch
      - -u
      - '{{ .Env.GPG_FINGERPRINT }}'
      - --output
      - '${signature}'
      - --detach-sign
      - '${artifact}'

release:
  draft: false
  prerelease: auto
